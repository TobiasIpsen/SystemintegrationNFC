services:
  RaspberryPiBackendDb:
    container_name: rasppidb
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      # - 5432:5432
      - 5438:5432
    volumes:
      - ./data/postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=rasppidb

  rabbitmq:
    healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
    container_name: rasppi_rabbitmq
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    ports:
      - 5672:5672   # AMQP
      - 15672:15672 # Management UI (http://localhost:15672)
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
    # THIS IS BAD (in our context) ; RabbitMQ + Windows mount binding : RabbitMQ requires an .erlang.cookie to have 600 permissions (owner only),
    # but when we bind-mount a Windows host folder (./data/rabbitmq-data:/var/lib/rabbitmq) straight onto /var/lib/rabbitmq , the cookie gets created
    # inside the bind mount - and Windows bind mounts "can't represent restrictive Unix permission bits" so RabbitMQ refuses to start as a security precaution.
      # - ./data/rabbitmq-data:/var/lib/rabbitmq
    # Fix: RabbitMQ only needs persistence for the 'mnesia' subfolder - the .erlang.cookie is fine living in the container's own writable layer, where permissions work correctly.
      - ./data/rabbitmq-data:/var/lib/rabbitmq/mnesia

  rasppi-api:
    container_name: rasppi_api
    build:
      context: ..
      dockerfile: RaspberryPiAPI/Dockerfile
    ports:
      - "5292:8080"
    environment:
      # Overrides the appsettings' connection string ; this way we can both do local dev with one port-setting and run it via compose, which'll match the other compose services
      - ConnectionStrings__RaspPiDb=Host=RaspberryPiBackendDb;Port=5432;Database=rasppidb;Username=root;Password=root

      # Ensures the feature toggle is present when composing up
      # BASH variant:
      # feattogg_skipusereventcheck=true docker compose up -d
      # Powershell variant:
      # $env:feattogg_skipusereventcheck="true"; docker compose up -d
      - "FeatureManagement__SkipEventUserCheck=${feattogg_skipusereventcheck:?Missing flag: feattogg_skipusereventcheck=<true|false>}"

      - RabbitMQ__Uri=amqp://guest:guest@rabbitmq:5672/%2f
    depends_on:
      RaspberryPiBackendDb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
