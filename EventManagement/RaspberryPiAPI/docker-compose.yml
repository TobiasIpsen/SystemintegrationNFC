services:
  RaspberryPiBackendDb:
    image: postgres:18-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - 5432:5432
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data_rasppibackenddb
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=rasppidb

  RaspPiDbPgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    depends_on:
      - RaspberryPiBackendDb
    ports:
      - 8084:80
    volumes:
      - ./data/pgadmin-data:/var/lib/pgadmin_rasppibackend
    environment:
      - PGADMIN_DEFAULT_EMAIL=root@local.com
      - PGADMIN_DEFAULT_PASSWORD=root

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    ports:
      - 5672:5672   # AMQP
      - 15672:15672 # Management UI (http://localhost:15672)
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - ./data/rabbitmq-data:/var/lib/rabbitmq

volumes:
  pgdata:
